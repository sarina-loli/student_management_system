{% extends 'base.html' %}

{% block content %}

<h2>
    Dashboard
</h2>

<div class="dashboard-grid">

    <div class="dashboard-card">

        <h3>
            Students
        </h3>

        <p>
            {{ total_students }}
        </p>

    </div>

    <div class="dashboard-card">

        <h3>
            Courses
        </h3>

        <p>
            {{ total_courses }}
        </p>

    </div>

    <div class="dashboard-card">

        <h3>
            Subjects
        </h3>

        <p>
            {{ total_assignments }}
        </p>

    </div>

    <div class="dashboard-card">

        <h3>
            Attendance
        </h3>

        <p>
            {{ total_attendance }}
        </p>

    </div>

</div>

<div class="card">

    <h3>
        Welcome
        {{ request.user.username }}
    </h3>

    <p>

        Manage your entire
        institution from one dashboard.

    </p>

</div>

{% endblock %}
