{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>
        {% if object %}Edit Subject{% else %}Add Subject{% endif %}
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">

            Save Subject

        </button>

    </form>

</div>

{% endblock %}
