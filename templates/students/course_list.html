{% extends 'base.html' %}

{% block content %}

<div class="page-header">

    <h2>
        Courses
    </h2>

    <a href="{% url 'course_add' %}"
       class="btn">

        Add Course

    </a>

</div>

<form method="GET" class="search-form">

    <input type="text"
           name="q"
           value="{{ request.GET.q }}"
           placeholder="Search Course">

    <button type="submit"
            class="btn">

        Search

    </button>

</form>

<div class="table-responsive">

<table>

    <thead>

        <tr>

            <th>Name</th>

            <th>Code</th>

            <th>Description</th>

            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

        {% for course in courses %}

        <tr>

            <td>
                {{ course.name }}
            </td>

            <td>
                {{ course.code }}
            </td>

            <td>
                {{ course.description|truncatewords:12 }}
            </td>

            <td>

                <div class="action-links">

                    <a href="{% url 'course_edit' course.id %}"
                       class="btn-edit">
                        Edit
                    </a>

                    <a href="{% url 'course_delete' course.id %}"
                       class="btn-delete">
                        Delete
                    </a>

                </div>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="4">

                No Courses Found

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

</div>

{% endblock %}
