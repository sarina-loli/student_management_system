{% extends 'base.html' %}

{% block content %}

<div class="page-header">

    <h2>
        Courses
    </h2>

    <a href="{% url 'course_add' %}"
       class="btn">

        Add Course

    </a>

</div>

<table>

    <thead>

        <tr>

            <th>Name</th>

            <th>Code</th>

            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

        {% for course in object_list %}

        <tr>

            <td>
                {{ course.name }}
            </td>

            <td>
                {{ course.code }}
            </td>

            <td>

                <a href="{% url 'course_edit' course.id %}">
                    Edit
                </a>

                <a href="{% url 'course_delete' course.id %}">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
