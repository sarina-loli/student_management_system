{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>
        Delete Record
    </h2>

    <p>

        Are you sure you want
        to delete this record?

    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit"
                class="btn">

            Confirm Delete

        </button>

    </form>

</div>

{% endblock %}
