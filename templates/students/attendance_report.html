{% extends 'base.html' %}

{% block content %}

<h2>
Attendance Report
</h2>

<table>

<tr>
<th>Student</th>
<th>Subject</th>
<th>Date</th>
<th>Status</th>
</tr>

{% for item in attendance %}

<tr>

<td>{{ item.student }}</td>

<td>{{ item.subject }}</td>

<td>{{ item.date }}</td>

<td>{{ item.status }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
