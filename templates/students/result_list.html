{% extends 'base.html' %}

{% block content %}

<h2>
    Results
</h2>

<table>

    <thead>

        <tr>

            <th>Student</th>
            <th>Subject</th>
            <th>Marks</th>
            <th>Grade</th>

        </tr>

    </thead>

    <tbody>

        {% for result in results %}

        <tr>

            <td>{{ result.student }}</td>

            <td>{{ result.subject }}</td>

            <td>{{ result.marks }}</td>

            <td>{{ result.grade }}</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
