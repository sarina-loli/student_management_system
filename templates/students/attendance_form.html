{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>
        {% if object %}Edit Attendance{% else %}Record Attendance{% endif %}
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn">

            Save Attendance

        </button>

    </form>

</div>

{% endblock %}
