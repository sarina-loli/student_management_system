{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>
        Edit Profile
    </h2>

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn">

            Save Profile

        </button>

    </form>

</div>

{% endblock %}
